<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="calculator" role="application" aria-label="Calculator">
        <div class="logo">
            <img src="images/Logo2.png" alt="Anuvab Munshi logo">
        </div>
        <div class="solar-panel">
            <img src="images/Solar Panel.jpg" alt="" aria-hidden="true">
        </div>
        <div
            class="display"
            id="display"
            role="status"
            aria-live="polite"
            aria-atomic="true"
            aria-label="Calculator display"
        ></div>
        <div class="buttons" role="group" aria-label="Calculator buttons">
            <button class="btn" data-type="clear" aria-label="All Clear">AC</button>
            <button class="btn" data-type="operator" data-value="√" aria-label="Square root"><i class="fa-solid fa-square-root-variable" aria-hidden="true"></i></button>
            <button class="btn" data-type="operator" data-value="%" aria-label="Percent"><i class="fas fa-percent fa-sm" aria-hidden="true"></i></button>
            <button class="btn" data-type="toggle-sign" aria-label="Toggle positive or negative"><i class="fas fa-plus-minus fa-sm" aria-hidden="true"></i></button>
            <button class="btn" data-type="digit" data-value="7" aria-label="7">7</button>
            <button class="btn" data-type="digit" data-value="8" aria-label="8">8</button>
            <button class="btn" data-type="digit" data-value="9" aria-label="9">9</button>
            <button class="btn" data-type="operator" data-value="/" aria-label="Divide"><i class="fas fa-divide fa-sm" aria-hidden="true"></i></button>
            <button class="btn" data-type="digit" data-value="4" aria-label="4">4</button>
            <button class="btn" data-type="digit" data-value="5" aria-label="5">5</button>
            <button class="btn" data-type="digit" data-value="6" aria-label="6">6</button>
            <button class="btn" data-type="operator" data-value="*" aria-label="Multiply"><i class="fas fa-times fa-sm" aria-hidden="true"></i></button>
            <button class="btn" data-type="digit" data-value="1" aria-label="1">1</button>
            <button class="btn" data-type="digit" data-value="2" aria-label="2">2</button>
            <button class="btn" data-type="digit" data-value="3" aria-label="3">3</button>
            <button class="btn" data-type="operator" data-value="-" aria-label="Subtract"><i class="fas fa-minus fa-sm" aria-hidden="true"></i></button>
            <button class="btn" data-type="decimal" aria-label="Decimal point"><i class="fa-solid fa-circle fa-2xs" aria-hidden="true"></i></button>
            <button class="btn" data-type="digit" data-value="0" aria-label="0">0</button>
            <button class="btn" data-type="operator" data-value="+" aria-label="Add"><i class="fas fa-plus fa-sm" aria-hidden="true"></i></button>
            <button class="btn" data-type="equals" aria-label="Equals"><i class="fas fa-equals fa-sm" aria-hidden="true"></i></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
